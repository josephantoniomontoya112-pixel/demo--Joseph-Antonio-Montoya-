<!DOCTYPE html>
<html lang="en">

<head>

  <title>Budget and Expense Tracker</title>

  <style>

    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fafafa;
  color: #333;
}

.page {
  display: none;
  max-width: 500px;
  margin: 20px auto;
  padding: 10px;
  background: #fff;
  border: 1px solid #ccc;
}

.active {
  display: block;
}

h1, h2, h3 {
  margin-top: 0;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}

input, select, button {
  margin: 5px 0;
  padding: 5px;
  width: 100%;
  border: 1px solid #ccc;
}

button {
  background: #007bff;
  color: #fff;
  border: none;
}

button.reset {
  background: #dc3545;
  color: #fff;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  padding: 5px;
  border-bottom: 1px solid #ccc;
}

p {
  margin: 5px 0;
}


  </style>

</head>

<body>

  <!-- front page -->
  <div id="introPage" class="page active">
    <h1>Budget and Expense Tracker</h1>
    <p>Track your expenses and manage your budget easily.</p>
    <button onclick="goToTracker()">Start Tracking</button>
  </div>

  <!-- the system -->
  <div id="trackerPage" class="page">
    <h2>Budget and Expense Tracker</h2>

    <label>Budget Amount:</label>
    <input type="number" id="budget" placeholder="Enter your total budget" />

    <h3>Add Expense</h3>
    <input type="text" id="desc" placeholder="Expense Description" />
    <input type="number" id="amount" placeholder="Amount" />

    <select id="timeframe">
      <option value="Day">Day</option>
      <option value="Week">Week</option>
      <option value="Month">Month</option>
    </select>

    <select id="category">
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
      <option value="Budget">Budget</option>
    </select>
    <button onclick="addExpense()">Add Expense</button>

    <h3>Expenses</h3>
    <ul id="expenseList"></ul>

    <h3>Summary</h3>
    <p>Total Expenses: <span id="total">0</span></p>
    <p>Remaining Budget: <span id="remaining">0</span></p>

    <button class="reset" onclick="resetTracker()">Reset All</button>
  </div>

  <script>
    let budget = 0;
    let expenses = [];

    window.addEventListener("DOMContentLoaded", () => {
      const savedBudget = localStorage.getItem("budget");
      const savedExpenses = localStorage.getItem("expenses");
      if (savedBudget) budget = parseFloat(savedBudget);
      if (savedExpenses) { expenses = JSON.parse(savedExpenses); displayExpenses(); }
      updateSummary();
    });

    function goToTracker() {
      document.getElementById('introPage').classList.remove('active');
      document.getElementById('trackerPage').classList.add('active');
    }

    function updateSummary() {
      let total = expenses.reduce((sum, e) => sum + e.amount, 0);
      document.getElementById('total').textContent = total.toFixed(2);
      let remaining = budget - total;
      if (remaining < 0) remaining = 0;
      document.getElementById('remaining').textContent = remaining.toFixed(2);
    }

    function addExpense() {
      let newBudget = parseFloat(document.getElementById('budget').value) || 0;
      if (newBudget > 0) {
        budget += newBudget;
        localStorage.setItem("budget", budget);
        document.getElementById('budget').value = '';
      }

      const desc = document.getElementById('desc').value || "No description";
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const timeframe = document.getElementById('timeframe').value;
      const category = document.getElementById('category').value || "Other";

      let total = expenses.reduce((sum, e) => sum + e.amount, 0);
      if (total + amount > budget) {
        alert("Cannot add expense: it exceeds your remaining budget!");
        return;
      }

      const expense = { description: desc, amount: amount, timeframe: timeframe, category: category };
      expenses.push(expense);
      localStorage.setItem("expenses", JSON.stringify(expenses));
      displayExpenses(); 
      updateSummary();

      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('timeframe').value = 'Day';
      document.getElementById('category').value = 'Food';
    }

    function displayExpenses() {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';
      expenses.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.timeframe} - ${item.description} (${item.category}): ₱${item.amount.toFixed(2)}`;
        list.appendChild(li);
      });
    }

    function resetTracker() {
      if (confirm("Are you sure you want to reset all data?")) {
        budget = 0; expenses = []; localStorage.clear();
        document.getElementById('budget').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('timeframe').value = 'Day';
        document.getElementById('category').value = 'Food';
        document.getElementById('expenseList').innerHTML = '';
        document.getElementById('total').textContent = '0';
        document.getElementById('remaining').textContent = '0';
      }
    }
  </script>
</body>
</html>
